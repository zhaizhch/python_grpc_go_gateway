version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/envoyproxy/protoc-gen-validate
  override:
    - file_option: go_package_prefix
      value: gitlab.bjuci.io/agent/proto/
plugins:
  - remote: buf.build/protocolbuffers/go:v1.32.0
    out: ./proto
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.3.0
    out: ./proto
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway:v2.19.1
    out: ./proto
    opt: paths=source_relative
  - remote: buf.build/bufbuild/validate-go:v1.0.4
    out: ./proto
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/python:v25.0
    out: ./proto
  - remote: buf.build/grpc/python:v1.60.0
    out: ./proto
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.20.0
    out: ./proto/swagger
