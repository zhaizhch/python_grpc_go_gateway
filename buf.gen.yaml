version: v1
managed:
  enabled: true
  go_package_prefix:
    default: gitlab.bjuci.io/agent/proto/
    except:
      - buf.build/googleapis/googleapis
      - buf.build/envoyproxy/protoc-gen-validate

plugins:
  - plugin: buf.build/protocolbuffers/go:v1.32.0
    out: ./proto
    opt: paths=source_relative
  - plugin: buf.build/grpc/go:v1.3.0
    out: ./proto
    opt: paths=source_relative
  - plugin: buf.build/grpc-ecosystem/gateway:v2.19.1
    out: ./proto
    opt: paths=source_relative
  - plugin: buf.build/bufbuild/validate-go:v1.0.4
    out: ./proto
    opt: paths=source_relative
  - plugin: buf.build/protocolbuffers/python:v25.0
    out: .
  - plugin: buf.build/grpc/python:v1.60.0
    out: .
  # 生成 OpenAPI 文档
  - plugin: buf.build/grpc-ecosystem/openapiv2:v2.20.0
    out: swagger