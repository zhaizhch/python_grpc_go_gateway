syntax = "proto3";

package agent.v1.constructionprogress;

option go_package = "gitlab.bjuci.io/agent-be/proto/agent/v1/constructionprogress";  // 控制 Go 包名
//option python_package = "gitlab.bjuci.io/agent-be/proto/agent/v1/constructionprogress"; // 控制 Python 包名

import "validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

service ConstructionService{
  rpc ListConstruction(ListConstructionRequest)returns(ListConstructionResponse){
    option (google.api.http) = {
      post : "/api/v1/construction/progress"
      body : "*"
    };
  }

  rpc CreateConstructionProgress(ConstructionProgress)returns(CommonResponse){
    option (google.api.http) = {
      post : "/api/v1/construction/create"
      body : "*"
    };
  }
}

message ListConstructionRequest{
  int64 page = 1;
  int64 page_size = 2;
}

message ListConstructionResponse{
  repeated ConstructionProgress items = 1;
  int64 total = 2;
  int64 page = 3;
  int64 page_size = 4;
}

message ConstructionProgress{
  string name = 1;
  string type = 2;
  string progress = 3;
  string creator = 4;
  string created_at = 5;
  string updated_at = 6;
}

message CommonResponse{
  int64 id = 1;
}